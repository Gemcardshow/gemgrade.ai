# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5d873659d0a23f0e2d0b9931e2ae744e"
name = "GemGrade Auth Handoff"
application_url = "https://app.gemcardshow.com"
embedded = false

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://app.gemcardshow.com/api/auth/shopify/callback"
]

[app_proxy]
url = "/api/auth/shopify/handoff"
subpath = "gghandoff"
prefix = "apps"
