# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "GemGrade Auth Handoff"
application_url = "https://app.gemcardshow.com"
embedded = false
handle = "gemgrade-auth-handoff"

# client_id is filled by `shopify app config link` / Dev Dashboard Settings
client_id = "REPLACE_WITH_DEV_DASHBOARD_CLIENT_ID"

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[access_scopes]
scopes = "read_customers,write_app_proxy"

[auth]
redirect_urls = [
  "https://app.gemcardshow.com/api/auth/shopify/callback"
]

[app_proxy]
url = "https://app.gemcardshow.com/api/auth/shopify/handoff"
prefix = "apps"
subpath = "gemgrade"

[webhooks]
api_version = "2025-01"
