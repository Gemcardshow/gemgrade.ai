# GemGrade iOS App Store production workflow (Capacitor)
# Signing: App Store Connect integration "GemGrade Codemagic" + fetch-signing-files --create
# Do not commit Apple secrets.

workflows:
  gemgrade-ios-app-store:
    name: GemGrade iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match Codemagic → Team integrations → Developer Portal key name
      app_store_connect: GemGrade Codemagic
    environment:
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.gemcardshow.gemgrade
        MARKETING_VERSION: "1.0.0"
        BUILD_NUMBER: "1"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Initialize keychain for code signing
        script: |
          keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          set -e
          openssl genrsa -out /tmp/ios_distribution_private_key.pem 2048
          chmod 600 /tmp/ios_distribution_private_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key="$(cat /tmp/ios_distribution_private_key.pem)"
          rm -f /tmp/ios_distribution_private_key.pem
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Apply provisioning profiles to Xcode project
        script: |
          xcode-project use-profiles
      - name: Set marketing version and build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build App Store IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
